<text x="316" y="446" font-size="30" fill="#c8ec84" font-weight="700" text-anchor="start">Mais de 103 mil</text>
<text x="316" y="475" font-size="19" fill="#fff6c5" font-weight="400" text-anchor="start">pessoas atendidas pela rede</text>
<text x="624" y="446" font-size="30" fill="#c8ec84" font-weight="700" text-anchor="start">50</text>
